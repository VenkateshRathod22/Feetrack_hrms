name: vlr
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  get: ^4.6.6
  http: ^1.1.0
  onesignal_flutter: ^5.0.3
  google_fonts: ^6.1.0
  page_transition: ^2.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1
  toastification: ^3.0.1
  cached_network_image: ^3.3.0
  lottie: ^3.1.3
  shimmer: ^3.0.0
  image_picker: ^1.0.4
  permission_handler: ^12.0.1
  custom_refresh_indicator: ^4.0.1
  flutter_svg: ^2.0.9
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  pinput: ^5.0.0
  share_plus: ^11.0.0
  package_info_plus: ^8.0.2
  carousel_slider: ^5.1.1
  webview_flutter: ^4.8.0
  connectivity_plus: ^6.0.3
  sms_autofill: ^2.4.1
  flutter_html: ^3.0.0-beta.2
  flutter_screenutil: ^5.9.3
  syncfusion_flutter_gauges: ^33.2.15
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  firebase_core: ^4.11.0
  month_picker_dialog: ^6.7.2
  http_parser: 
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  

dependency_overrides:
  path_provider_foundation: 2.3.0
  permission_handler_android: ^12.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon_logo.png"
  min_sdk_android: 21
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/
    - assets/gif/

flutter_assets:
  assets_path: assets/
  output_path: lib/generated/
  filename: assets.dart
  field_prefix:
